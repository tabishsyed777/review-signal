<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewSignal</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&display=swap');:root{--ink:#10221e;--mute:#64736e;--line:#dbe5e0;--paper:#f7f8f3;--orange:#c95b21}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px 28px 64px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:25px}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.dot{color:#14a66f}.badge{font:11px 'DM Mono';padding:9px 12px;border:1px solid #decabf;background:#fff6f1;color:#8c421f;border-radius:20px}h1{font-size:38px;letter-spacing:-1.8px;margin:42px 0 8px}.sub,.note{color:var(--mute);font-size:14px;line-height:1.65}.empty{margin-top:28px;padding:30px;background:#fff;border:1px solid var(--line);border-radius:14px}.empty h2{margin:0 0 8px;font-size:20px}.code{background:#142922;color:#d8f8df;padding:13px 16px;border-radius:8px;font:12px 'DM Mono';overflow:auto}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:28px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.eyebrow{font:11px 'DM Mono';color:var(--mute);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}.effect{display:grid;grid-template-columns:100px 1fr 145px;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.ci{font:12px 'DM Mono';text-align:right}.warn{border-left:3px solid var(--orange);padding-left:12px;color:#79451f;font-size:12px;line-height:1.55}@media(max-width:700px){h1{font-size:30px}.grid{grid-template-columns:1fr}.effect{grid-template-columns:80px 1fr}.ci{grid-column:2;text-align:left}}</style><body><main class="wrap"><header class="top"><div class="brand"><span class="dot">●</span> ReviewSignal</div><span class="badge">SAMPLE / AWAITING ANALYSIS</span></header><h1>Customer-review evidence,<br>without invented certainty.</h1><p class="sub">This dashboard only displays results generated from saved analysis artifacts. It does not claim verified insights until a dataset, labels, and model outputs exist.</p><section id="app"><div class="empty"><h2>Loading analysis state…</h2></div></section></main><script>const app=document.querySelector('#app');const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('data/results.json').then(r=>r.json()).then(d=>{if(d.status!=='computed'){app.innerHTML=`<div class="empty"><div class="eyebrow">No computed results</div><h2>Run the reproducible pipeline first.</h2><p class="note">No review count, F1, cost, rating effect, return impact, or confidence claim is shown until it is calculated from an authorised dataset. The bundled source supports ratings only; add an authorised sales/returns join before reporting returns.</p><pre class="code">python scripts/extract_aspects.py --input data/raw/reviews.jsonl --output data/processed/extractions.csv --mode rules\npython scripts/analyze.py --input data/processed/extractions.csv --out results/analysis.json\npython scripts/build_dashboard_data.py</pre><p class="warn">Rating associations are not causal. The model reports product fixed effects and HC3 robust 95% confidence intervals; evidence examples should be randomly sampled and labelled as such.</p></div>`;return}const a=d.analysis;app.innerHTML=`<div class="grid"><section class="card"><div class="eyebrow">Adjusted rating associations · n=${a.n_reviews.toLocaleString()}</div><h2>Aspect coefficients with 95% confidence intervals</h2>${a.effects.map(e=>`<div class="effect"><b>${esc(e.aspect)}</b><span>${e.coefficient>0?'+':''}${e.coefficient} ★</span><span class="ci">95% CI [${e.ci_low}, ${e.ci_high}]<br>mentioned n=${e.n_mentioned}</span></div>`).join('')}<p class="note">${esc(a.model)} Association only; not a causal claim.</p></section><aside class="card"><div class="eyebrow">Benchmark</div><h2>${d.benchmark?esc(d.benchmark.method):'Not run'}</h2>${d.benchmark?`<p class="note">Held-out labelled reviews: n=${d.benchmark.labelled_n}</p>${d.benchmark.per_aspect.map(x=>`<div class="effect"><b>${x.aspect}</b><span>F1 ${x.f1}</span><span class="ci">n=${x.n}</span></div>`).join('')}`:'<p class="note">Run benchmark.py after independently hand-labelling a held-out set. Cost is reported only from recorded invoices or logged usage.'}</aside></div>`}).catch(()=>app.innerHTML='<div class="empty"><h2>Analysis artifact unavailable.</h2><p class="note">Serve this folder via a local web server after running build_dashboard_data.py.</p></div>')</script></body></html>
